asanakit: 2
id: tittibhasana
name: Firefly Pose
sanskrit: Ṭiṭṭibhāsana
english: Firefly Pose
discipline: yoga
family: arm-balance
difficulty: 5
description: A deep-compression arm balance. The hands root behind the heels, the thighs squeeze high onto the upper arms, the hips hover low behind the wrists and both legs shoot straight forward and up like antennae.
tags: [ arm-balance, core, hamstring-opener, balance ]
breath: free
drishti: nasagrai
cues:
  - Wiggle the shoulders as far behind the knees as they go
  - Press the floor away, round the upper back
  - Squeeze the inner thighs against the arms and straighten the legs
contact: [ handTipL, handTipR ]
camera: three-quarter
figure:
  grounded: true
  root:
    pitch: 30
  world:
    pelvis: { azimuth: 0, elevation: 25 }
    spine: { azimuth: 0, elevation: 25 }
    neck: { azimuth: 0, elevation: 40 }
    head: { azimuth: 0, elevation: 45 }
    upperArmL: { azimuth: 180, elevation: -75 }
    upperArmR: { azimuth: 180, elevation: -75 }
    forearmL: { azimuth: 0, elevation: -88 }
    forearmR: { azimuth: 0, elevation: -88 }
    handL: { azimuth: 0, elevation: -2 }
    handR: { azimuth: 0, elevation: -2 }
    thighL: { azimuth: 25, elevation: 15 }
    thighR: { azimuth: -25, elevation: 15 }
    shinL: { azimuth: 25, elevation: 15 }
    shinR: { azimuth: -25, elevation: 15 }
    footL: { azimuth: 25, elevation: 60 }
    footR: { azimuth: -25, elevation: 60 }
props:
  - type: mat
muscles:
  engaged: [ quadriceps, hipFlexors, rectusAbdominis, serratus, triceps, forearmFlexors, adductors ]
  stretched: [ hamstrings, gluteus, erectorSpinae, adductors ]
