asanakit: 2
id: phalakasana
name: Plank
sanskrit: Phalakāsana
english: Plank Pose
discipline: yoga
family: core
difficulty: 2
description: The top of a push-up. Straight arms stack the shoulders over the wrists and the body holds one unbroken line from the heels to the crown of the head.
tags: [ core, arm-support, strengthening ]
breath: exhale
drishti: nasagrai
cues:
  - Stack the shoulders over the wrists
  - Press the heels back and reach the crown forward
  - Draw the belly to the spine - no sagging, no piking
contact: [ toeL, toeR, handTipL, handTipR ]
camera: side
