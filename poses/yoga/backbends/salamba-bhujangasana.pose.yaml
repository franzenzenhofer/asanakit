asanakit: 2
id: salamba-bhujangasana
name: Sphinx
sanskrit: Sālamba Bhujaṅgāsana
english: Sphinx Pose
discipline: yoga
family: backbend
difficulty: 1
description: A gentle prone backbend on the forearms. The elbows stack under the shoulders, the forearms press flat and forward, and the chest lifts through the upper back while the pelvis stays down.
tags: [ backbend, prone, restorative, beginner ]
breath: inhale
drishti: nasagrai
cues:
  - Stack the elbows under the shoulders, forearms parallel
  - Drag the mat back with the forearms to lift the chest
contact: [ hipCenter, kneeL, kneeR, toeL, toeR, elbowL, elbowR, handTipL, handTipR ]
camera: side
