asanakit: 2
id: pincha-mayurasana
name: Forearm Stand
sanskrit: Piñcha Mayūrāsana
english: Feathered Peacock Pose
discipline: yoga
family: inversion
difficulty: 4
description: A full inversion balanced on the forearms. The forearms press parallel into the floor, the upper arms stand vertical, the head hovers off the mat and the body stacks upside down with the legs reaching straight up.
tags: [ inversion, balance, arm-support, shoulder-opener ]
breath: free
drishti: nasagrai
cues:
  - Press the whole forearm down and lift the shoulders away from the floor
  - Stack hips over shoulders, ribs knitted in
  - Gaze between the thumbs, keep the head off the mat
contact: [ elbowL, elbowR, handTipL, handTipR ]
camera: side
figure:
  grounded: true
  root:
    pitch: 180
  world:
    pelvis: { azimuth: 0, elevation: -90 }
    spine: { azimuth: 0, elevation: -90 }
    neck: { azimuth: 0, elevation: -70 }
    head: { azimuth: 0, elevation: -55 }
    upperArmL: { azimuth: 180, elevation: -82 }
    upperArmR: { azimuth: 180, elevation: -82 }
    forearmL: { azimuth: 0, elevation: 0 }
    forearmR: { azimuth: 0, elevation: 0 }
    handL: { azimuth: 0, elevation: 0 }
    handR: { azimuth: 0, elevation: 0 }
    thighL: { azimuth: 0, elevation: 90 }
    thighR: { azimuth: 0, elevation: 90 }
    shinL: { azimuth: 0, elevation: 90 }
    shinR: { azimuth: 0, elevation: 90 }
    footL: { azimuth: 180, elevation: 85 }
    footR: { azimuth: 180, elevation: 85 }
props:
  - type: mat
muscles:
  engaged: [ deltoid, rotatorCuff, serratus, trapezius, rectusAbdominis, gluteus, quadriceps ]
