asanakit: 2
id: eka-pada-rajakapotasana
name: Pigeon Pose
sanskrit: Eka Pāda Rājakapotāsana
english: One-Legged King Pigeon Pose
discipline: yoga
family: seated
difficulty: 3
description: The left shin folds across the front of the mat with the knee wide, while the right leg extends long behind, kneecap and foot top on the floor. The torso stays lifted, hands pressing the floor beside the hips.
tags: [ seated, hatha, hip-opener ]
breath: free
drishti: nasagrai
cues:
  - Square the hips toward the front of the mat
  - Press the fingertips down and lift the chest away from the front shin
