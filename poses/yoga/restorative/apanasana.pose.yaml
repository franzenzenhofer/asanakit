asanakit: 2
id: apanasana
name: Knees-to-Chest Pose
sanskrit: Apānāsana
english: Knees-to-Chest Pose
discipline: yoga
family: restorative
difficulty: 1
description: A supine hug. The back rests along the floor, both knees draw in over the chest and the arms wrap around the shins, gently squeezing the thighs toward the ribs with each exhale.
tags: [ restorative, supine, forward-fold ]
breath: exhale
drishti: nasagrai
cues:
  - Hug the shins, let the shoulders stay heavy
  - Draw the knees closer on each exhale
  - Keep the sacrum and the back of the head on the floor
contact: [ headTop, shoulderL, shoulderR, hipCenter ]
camera: side
