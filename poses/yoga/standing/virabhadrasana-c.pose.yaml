asanakit: 2
id: virabhadrasana-c
name: Warrior III
sanskrit: Vīrabhadrāsana C
english: Warrior III
discipline: yoga
family: standing
difficulty: 3
description: A flying balance in one long line. The torso and the lifted back leg are parallel to the floor over a strong straight standing leg, arms reaching forward past the ears.
tags: [ standing, balance, vinyasa ]
breath: exhale
drishti: nasagrai
cues:
  - One straight line from fingertips to lifted heel
  - Square the hips toward the floor
  - Flex the lifted foot and press back through the heel
