asanakit: 2
id: ustrasana
name: Camel
sanskrit: Uṣṭrāsana
english: Camel Pose
discipline: yoga
family: backbend
difficulty: 3
description: Kneeling upright with the shins on the floor, the hips press forward over the knees while the spine arcs back and the hands reach down to the heels. The chest lifts toward the ceiling and the head releases back.
tags: [ backbend, kneeling, chest-opener ]
breath: inhale
drishti: urdhva
cues:
  - Press the hips forward, over the knees
  - Lift the chest to the ceiling before reaching for the heels
  - Let the head follow the arc of the spine, not lead it
contact: [ kneeL, kneeR, ankleL, ankleR, toeL, toeR ]
camera: side
