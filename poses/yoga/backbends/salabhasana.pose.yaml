asanakit: 2
id: salabhasana
name: Locust
sanskrit: Śalabhāsana
english: Locust Pose
discipline: yoga
family: backbend
difficulty: 2
description: Lying prone, the chest and both straight legs lift away from the floor at once. The arms reach back alongside the body, palms down, and the whole back body works.
tags: [ backbend, prone, strengthening ]
breath: inhale
drishti: nasagrai
cues:
  - Reach the legs long and back before lifting them
  - Lift the chest and the legs on the same breath
  - Reach the fingertips toward the heels
contact: [ hipCenter, hipJointL, hipJointR ]
camera: side
figure:
  grounded: true
  root:
    pitch: 92
  world:
    thighL: { azimuth: 180, elevation: 12 }
    thighR: { azimuth: 180, elevation: 12 }
    shinL: { azimuth: 180, elevation: 12 }
    shinR: { azimuth: 180, elevation: 12 }
