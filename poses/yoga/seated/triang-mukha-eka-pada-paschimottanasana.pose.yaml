asanakit: 2
id: triang-mukha-eka-pada-paschimottanasana
name: Three-Limbed Forward Fold
sanskrit: Triāṅg Mukha Eka Pāda Paścimottānāsana
english: Three-Limbed Face-to-Foot Pose
discipline: yoga
family: seated
difficulty: 3
description: The left leg reaches straight forward while the right leg folds back in hero position, the right foot beside the right hip with the toes pointing back. The torso folds over the straight leg, hands reaching for the flexed foot.
tags: [ ashtanga, primary-series, seated, forward-fold ]
breath: exhale
drishti: padhayoragrai
cues:
  - Keep the weight leaning into the straight-leg hip
  - Fold from the hips, reaching the chest along the left leg
contact: [ hipCenter, kneeL, ankleL, kneeR, ankleR ]
