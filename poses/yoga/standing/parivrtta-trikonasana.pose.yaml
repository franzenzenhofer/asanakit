asanakit: 2
id: parivrtta-trikonasana
name: Revolved Triangle
sanskrit: Parivṛtta Trikoṇāsana
english: Revolved Triangle Pose
discipline: yoga
family: twist
difficulty: 4
description: A standing twist over straight legs. With the left foot forward, the torso hinges level and revolves left - the right hand descends to the floor outside the front foot while the left arm rises straight up.
tags: [ twist, standing, hatha, ashtanga, balance ]
breath: exhale
drishti: hastagrai
cues:
  - Lengthen the spine level before you revolve
  - Press both feet down, hips squared to the front
  - Stack the top shoulder over the bottom one
contact: [ toeL, toeR, handTipR ]
camera: three-quarter
figure:
  grounded: true
  root:
    pitch: 55
  world:
    thighL: { azimuth: 0, elevation: -62 }
    shinL: { azimuth: 0, elevation: -62 }
    footL: { azimuth: 0, elevation: 0 }
    thighR: { azimuth: 180, elevation: -58 }
    shinR: { azimuth: 180, elevation: -58 }
    footR: { azimuth: -35, elevation: 0 }
    spine: { azimuth: 0, elevation: -10, twist: 55 }
    neck: { azimuth: 0, elevation: -5 }
    head: { azimuth: 20, elevation: 5 }
    upperArmR: { azimuth: 0, elevation: -85 }
    forearmR: { azimuth: 0, elevation: -85 }
    handR: { azimuth: 0, elevation: -85 }
    upperArmL: { azimuth: 15, elevation: 80 }
    forearmL: { azimuth: 15, elevation: 80 }
    handL: { azimuth: 15, elevation: 80 }
props:
  - type: mat
muscles:
  engaged: [ obliques, erectorSpinae, quadriceps, deltoid ]
  stretched: [ hamstrings, obliques, latissimus, gastrocnemius ]
