asanakit: 2
id: parivrtta-parsvakonasana
name: Revolved Side Angle
sanskrit: Parivṛtta Pārśvakoṇāsana
english: Revolved Side Angle Pose
discipline: yoga
family: twist
difficulty: 4
description: A lunging twist. The left knee bends deep in a lunge while the torso revolves left across the thigh, the right hand reaching the floor outside the front foot and the left arm extending past the ear.
tags: [ twist, standing, lunge, vinyasa, ashtanga ]
breath: exhale
drishti: hastagrai
cues:
  - Lengthen through the crown as you turn
  - Press the back heel away to anchor the twist
  - Reach the top arm over the ear in one long line
contact: [ toeL, toeR, handTipR ]
camera: three-quarter
figure:
  grounded: true
  root:
    pitch: 40
  world:
    thighL: { azimuth: 0, elevation: -18 }
    shinL: { azimuth: 180, elevation: -85 }
    footL: { azimuth: 0, elevation: 0 }
    thighR: { azimuth: 180, elevation: -34 }
    shinR: { azimuth: 180, elevation: -34 }
    footR: { azimuth: 0, elevation: -50 }
    spine: { azimuth: 0, elevation: 12, twist: 55 }
    neck: { azimuth: 0, elevation: 15 }
    head: { azimuth: 30, elevation: 30 }
    upperArmR: { azimuth: 0, elevation: -80 }
    forearmR: { azimuth: 0, elevation: -80 }
    handR: { azimuth: 0, elevation: -80 }
    upperArmL: { azimuth: 5, elevation: 35 }
    forearmL: { azimuth: 5, elevation: 35 }
    handL: { azimuth: 5, elevation: 35 }
props:
  - type: mat
muscles:
  engaged: [ obliques, quadriceps, gluteus, erectorSpinae, deltoid ]
  stretched: [ obliques, hipFlexors, latissimus, adductors ]
