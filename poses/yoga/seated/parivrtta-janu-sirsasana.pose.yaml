asanakit: 2
id: parivrtta-janu-sirsasana
name: Revolved Head-to-Knee Pose
sanskrit: Parivṛtta Jānu Śīrṣāsana
english: Revolved Head-to-Knee Pose
discipline: yoga
family: twist
difficulty: 3
description: The left leg stretches out to the side while the right knee bends in toward the groin. The torso side-bends along the left leg, the left forearm reaching down the inside of the leg toward the foot while the right arm arcs overhead and the chest revolves open to the sky.
tags: [ seated, twist, hatha, side-bend, forward-fold ]
breath: exhale
drishti: urdhva
cues:
  - Anchor the right sit bone as you slide down the left leg
  - Spin the chest toward the ceiling, reach the top arm over the ear
