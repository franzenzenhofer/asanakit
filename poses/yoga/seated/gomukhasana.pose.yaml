asanakit: 2
id: gomukhasana
name: Cow Face Pose
sanskrit: Gomukhāsana
english: Cow Face Pose
discipline: yoga
family: seated
difficulty: 3
description: Seated with the knees stacked one over the other at mid-line, each foot beside the opposite hip. The left arm reaches up and bends behind the head, the right arm bends up behind the back, and the hands work toward a clasp between the shoulder blades.
tags: [ seated, hatha, hip-opener, shoulder-opener ]
breath: free
drishti: nasagrai
cues:
  - Stack the left knee directly over the right and sit evenly on both sit bones
  - Reach the top elbow to the sky and the bottom elbow to the earth
contact: [ kneeR, ankleL, ankleR ]
