asanakit: 2
id: parighasana
name: Gate Pose
sanskrit: Parighāsana
english: Gate Pose
discipline: yoga
family: standing
difficulty: 2
description: A kneeling side bend. Kneeling on the right leg, the straight left leg reaches out to the side with the foot flat, the left hand rests down the left leg and the right arm arcs overhead like the beam of a gate.
tags: [ standing, kneeling, side-bend, hatha ]
breath: exhale
drishti: hastagrai
cues:
  - Kneel tall before you tilt sideways
  - Reach up and over, lengthening the top ribs
  - Rest the lower hand lightly on the extended leg
