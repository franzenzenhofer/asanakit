asanakit: 2
id: marichyasana-d
name: Pose Dedicated to the Sage Marichi D
sanskrit: Marīcyāsana D
english: Sage Marichi's Pose D
discipline: yoga
family: twist
difficulty: 5
description: The deepest of the Marichi poses. The left leg folds into half lotus, the right knee draws up with the sole flat, and the torso twists to the right - the left elbow levering outside the upright knee while the hands work toward a bind behind the back.
tags: [ ashtanga, primary-series, seated, twist, bind, hip-opener ]
breath: exhale
drishti: parsva
cues:
  - Lengthen the spine on the inhale, revolve deeper on the exhale
  - Press the elbow and the knee against each other to lever the twist
