asanakit: 2
id: eka-pada-koundinyasana
name: Eight-Limbed Sage Pose II
sanskrit: Eka Pāda Kauṇḍinyāsana
english: Pose Dedicated to the Sage Kaundinya II
discipline: yoga
family: arm-balance
difficulty: 5
description: A flying split on bent arms. The hands root shoulder-width, the elbows bend to a low chaturanga shelf, the left leg extends forward over the left upper arm and the right leg reaches long behind, both feet floating.
tags: [ arm-balance, core, split, balance ]
breath: free
drishti: nasagrai
cues:
  - Lay the left thigh high on the left upper arm
  - Bend the elbows to a shelf, lean the chest forward
  - Reach both legs apart until they float level
contact: [ handTipL, handTipR ]
camera: three-quarter
figure:
  grounded: true
  root:
    pitch: 84
  world:
