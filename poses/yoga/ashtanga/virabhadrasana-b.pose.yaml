    thighR: -144
    shinR: -144
    footR: -165
    spine: 90
    neck: 90
    head: 90
    upperArmL: 0
    forearmL: 0
    handL: 0
    upperArmR: 180
    forearmR: 180
    handR: 180
props:
  - type: mat
