asanakit: 2
id: skandasana
name: Side Lunge
sanskrit: Skandāsana
english: Side Lunge
discipline: yoga
family: standing
difficulty: 3
description: A deep lateral lunge. The left knee bends fully so the hips hover by the left heel while the right leg extends straight out to the side, heel down and toes lifting.
tags: [ standing, lunge, hip-opener, vinyasa ]
breath: exhale
drishti: nasagrai
cues:
  - Sink the hips toward the bent-side heel
  - Keep the straight leg active, toes flexing up
  - Stay tall in the chest, hands at the heart
