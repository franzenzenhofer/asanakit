asanakit: 2
id: utkata-konasana
name: Goddess Pose
sanskrit: Utkaṭa Koṇāsana
english: Goddess Pose
discipline: yoga
family: standing
difficulty: 2
description: A wide, regal squat. The feet turn out in a broad stance, the knees bend directly over the ankles, and the arms lift into a cactus with the palms facing forward.
