asanakit: 2
id: supta-matsyendrasana
name: Supine Twist
sanskrit: Supta Matsyendrāsana
english: Reclined Lord of the Fishes Pose
discipline: yoga
family: twist
difficulty: 1
description: A restorative reclined twist. Lying on the back with the arms wide, the left knee draws across the body toward the floor on the right side while both shoulders stay heavy and the gaze turns to the left.
tags: [ supine, twist, hatha, yin, restorative ]
breath: exhale
drishti: parsva
cues:
  - Keep both shoulder blades melting into the floor
  - Let the knee be heavy, let gravity do the twist
contact: [ shoulderL, shoulderR, kneeL, ankleR, handTipL, handTipR ]
figure:
  grounded: true
  root:
    pitch: 90
  world:
    thighR: { azimuth: 180, elevation: 0 }
    shinR: { azimuth: 180, elevation: 0 }
    footR: { azimuth: 180, elevation: 60 }
    thighL: { azimuth: -95, elevation: 5 }
    shinL: { azimuth: -175, elevation: 0 }
    footL: { azimuth: -175, elevation: 30 }
    spine: { azimuth: 0, elevation: 2 }
    neck: { azimuth: 0, elevation: 0 }
    head: { azimuth: 25, elevation: -2 }
    upperArmL: { azimuth: 90, elevation: 0 }
    forearmL: { azimuth: 90, elevation: 0 }
    handL: { azimuth: 90, elevation: 0 }
    upperArmR: { azimuth: -90, elevation: 0 }
    forearmR: { azimuth: -90, elevation: 0 }
    handR: { azimuth: -90, elevation: 0 }
props:
  - type: mat
muscles:
  engaged: [ rectusAbdominis ]
  stretched: [ obliques, gluteus, pectoralis, erectorSpinae ]
camera: top
