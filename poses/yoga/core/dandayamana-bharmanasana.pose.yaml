asanakit: 2
id: dandayamana-bharmanasana
name: Bird-Dog
sanskrit: Daṇḍāyamāna Bharmanāsana
english: Balancing Tabletop
discipline: yoga
family: core
difficulty: 2
description: From tabletop, the left arm reaches forward and the right leg reaches back until both are level with the spine. Two limbs carry the table while the trunk refuses to tip or twist.
tags: [ core, kneeling, balance, asymmetric ]
breath: exhale
drishti: nasagrai
cues:
  - Reach the left arm and the right heel away from each other
  - Keep the hips and shoulders square to the floor
  - Lengthen, do not lift - arm and leg stay in line with the spine
contact: [ handTipR, kneeL, ankleL, toeL ]
camera: side
