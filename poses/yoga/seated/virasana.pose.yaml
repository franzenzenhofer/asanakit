asanakit: 2
id: virasana
name: Hero Pose
sanskrit: Vīrāsana
english: Hero Pose
discipline: yoga
family: seated
difficulty: 2
description: Kneeling with the knees together and the feet drawn just outside the hips, the sit bones settle to the floor between the heels. The spine stacks tall and the hands rest quietly on the thighs.
