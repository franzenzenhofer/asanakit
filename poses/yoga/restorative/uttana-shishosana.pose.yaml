asanakit: 2
id: uttana-shishosana
name: Extended Puppy Pose
sanskrit: Uttāna Śiśosana
english: Extended Puppy Pose
discipline: yoga
family: restorative
difficulty: 1
description: A melting heart stretch. The hips stay stacked over the knees while the arms walk forward, the chest melts toward the floor and the forehead rests on the mat.
tags: [ restorative, forward-fold, shoulder-opener, backbend ]
breath: exhale
drishti: nasagrai
cues:
  - Keep the hips over the knees as the arms walk forward
  - Melt the chest toward the floor
  - Press the palms down and lengthen the sides of the waist
contact: [ kneeL, kneeR, ankleL, ankleR, toeL, toeR, handTipL, handTipR, headTop ]
camera: side
