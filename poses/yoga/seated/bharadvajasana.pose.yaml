asanakit: 2
id: bharadvajasana
name: Bharadvaja's Twist
sanskrit: Bharadvājāsana
english: Bharadvaja's Twist I
discipline: yoga
family: twist
difficulty: 2
description: A gentle seated twist. Both legs sweep to the side so the feet rest beside the right hip, and the torso revolves away from the legs toward the left - the right hand crossing to the left knee, the left hand tucked behind the back.
tags: [ seated, twist, hatha ]
breath: exhale
drishti: parsva
cues:
  - Ground both sit bones evenly before you turn
  - Turn the belly first, then the chest, then the gaze
