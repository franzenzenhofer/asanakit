    neck: { azimuth: 0, elevation: 5 }
    head: { azimuth: 0, elevation: 5 }
    upperArmL: { azimuth: 0, elevation: 8 }
    upperArmR: { azimuth: 0, elevation: 8 }
    forearmL: { azimuth: 0, elevation: 8 }
    forearmR: { azimuth: 0, elevation: 8 }
    handL: { azimuth: 0, elevation: 8 }
    handR: { azimuth: 0, elevation: 8 }
