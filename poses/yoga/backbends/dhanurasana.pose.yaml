asanakit: 2
id: dhanurasana
name: Bow
sanskrit: Dhanurāsana
english: Bow Pose
discipline: yoga
family: backbend
difficulty: 3
description: Prone, the knees bend and the hands reach back to catch the ankles. Kicking the shins back into the hands lifts the chest and the thighs, bending the whole body into a bow strung by the arms.
tags: [ backbend, prone, chest-opener ]
breath: inhale
drishti: urdhva
cues:
  - Catch the ankles, not the feet
  - Kick the shins back into the hands to lift the chest
  - Keep the knees no wider than the hips
contact: [ hipCenter, waist ]
camera: side
figure:
