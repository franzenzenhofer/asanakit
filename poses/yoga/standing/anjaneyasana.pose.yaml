asanakit: 2
id: anjaneyasana
name: Low Lunge
sanskrit: Añjaneyāsana
english: Low Lunge
discipline: yoga
family: standing
difficulty: 2
description: A kneeling lunge. The left foot steps far forward with the knee stacked over the ankle, the right knee and shin rest on the mat, and the arms sweep overhead as the hips sink forward.
tags: [ standing, lunge, hip-opener, vinyasa, backbend ]
breath: inhale
drishti: urdhva
cues:
  - Sink the hips forward and down, knee over ankle
  - Root the back shin, reach the arms alongside the ears
  - Lift the chest without crunching the lower back
contact: [ toeL, kneeR, ankleR, toeR ]
camera: side
