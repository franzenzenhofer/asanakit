asanakit: 2
id: prasarita-padottanasana-b
name: Wide-Legged Forward Fold B
sanskrit: Prasārita Pādottānāsana B
english: Wide-Legged Intense Stretch B
discipline: yoga
family: forward-fold
difficulty: 2
description: Feet wide and parallel, legs straight, hands on the waist. Keeping the hands where they are, the torso folds down between the legs and the crown of the head reaches toward the mat, elbows pointing up behind the back. Held five breaths.
tags: [ ashtanga, standing, forward-fold, primary-series ]
breath: exhale
drishti: nasagrai
cues:
  - Keep the hands firm on the waist as you fold
  - Draw the elbows toward each other behind the back
contact: [ toeL, toeR, headTop ]
