asanakit: 2
id: natarajasana
name: Dancer Pose
sanskrit: Naṭarājāsana
english: Lord of the Dance Pose
discipline: yoga
family: standing
difficulty: 4
description: A standing backbend balance. On a straight left leg the torso tips gently forward while the right knee bends and lifts behind, the right hand catching the foot and the left arm reaching forward.
tags: [ standing, balance, backbend, hatha ]
breath: inhale
drishti: hastagrai
cues:
  - Kick the lifted foot back and up into the hand
  - Reach the front arm long to counterbalance
  - Lift the chest as the leg rises
contact: [ toeL ]
camera: side
