asanakit: 2
id: bhujangasana
name: Cobra
sanskrit: Bhujaṅgāsana
english: Cobra Pose
discipline: yoga
family: backbend
difficulty: 2
description: Lying prone, the pelvis and legs stay rooted while the chest curls up and forward. The elbows stay bent and hug the ribs; the backbend comes from the spine, not the arms.
tags: [ backbend, prone, hatha, beginner ]
breath: inhale
drishti: urdhva
cues:
  - Keep the pelvis and the tops of the feet heavy on the mat
  - Curl the chest forward and up, elbows hugging the ribs
  - Shoulders roll back and down, away from the ears
contact: [ hipCenter, kneeL, kneeR, toeL, toeR, handTipL, handTipR ]
camera: side
figure:
  grounded: true
  root:
    pitch: 88
  world:
