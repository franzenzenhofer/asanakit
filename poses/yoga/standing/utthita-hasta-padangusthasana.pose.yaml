    head: { azimuth: 0, elevation: 80 }
    upperArmR: { azimuth: 0, elevation: -20 }
    forearmR: { azimuth: 0, elevation: -16 }
    handR: { azimuth: 0, elevation: -10 }
  joints:
    upperArmL: { abduct: 20 }
