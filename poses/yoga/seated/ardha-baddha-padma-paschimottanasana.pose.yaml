asanakit: 2
id: ardha-baddha-padma-paschimottanasana
name: Half Bound Lotus Forward Fold
sanskrit: Ardha Baddha Padma Paścimottānāsana
english: Half Bound Lotus Intense Stretch Pose
discipline: yoga
family: seated
difficulty: 4
description: The left leg extends straight forward while the right foot folds into half lotus at the left hip crease. The right arm wraps behind the back to bind the lotus foot, and the torso folds over the straight leg with the left hand reaching the left foot.
tags: [ ashtanga, primary-series, seated, forward-fold, bind, hip-opener ]
breath: exhale
drishti: padhayoragrai
cues:
  - Draw the lotus heel toward the navel before you fold
  - Reach the binding arm around the back on the exhale
contact: [ hipCenter, kneeL, ankleL, kneeR ]
