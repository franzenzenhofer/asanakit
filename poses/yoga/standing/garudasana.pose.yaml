asanakit: 2
id: garudasana
name: Eagle Pose
sanskrit: Garuḍāsana
english: Eagle Pose
discipline: yoga
family: standing
difficulty: 3
description: A wrapped balance. Sitting low on a bent left leg, the right thigh crosses over the left, and the arms cross at the elbows in front of the chest with the forearms rising together.
tags: [ standing, balance, hatha, vinyasa ]
breath: free
drishti: nasagrai
cues:
  - Sit low first, then wrap the leg over
  - Cross the elbows, lift them to shoulder height
  - Squeeze the midline, keep the gaze soft and steady
contact: [ toeL ]
camera: three-quarter
