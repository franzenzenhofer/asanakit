asanakit: 2
id: ardha-matsyendrasana
name: Half Lord of the Fishes
sanskrit: Ardha Matsyendrāsana
english: Half Lord of the Fishes Pose
discipline: yoga
family: twist
difficulty: 3
description: A deep seated twist. The right leg folds along the floor while the left foot steps flat outside the right knee, the left knee pointing up. The torso revolves toward the upright knee - the right arm levers against it while the left hand presses the floor behind the sacrum.
tags: [ seated, twist, hatha ]
breath: exhale
drishti: parsva
cues:
  - Inhale to grow tall, exhale to revolve around the spine
  - Press the standing foot down and hug the knee toward the chest
contact: [ kneeR, ankleR, ankleL, toeL, handTipL ]
