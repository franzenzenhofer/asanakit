asanakit: 2
id: ardha-navasana
name: Low Boat
sanskrit: Ardha Nāvāsana
english: Half Boat Pose
discipline: yoga
family: core
difficulty: 3
description: Balancing on the sacrum, the straight legs and the shoulders hover low over the floor while the lower back stays rounded into the mat. The arms reach forward alongside the legs.
tags: [ core, supine, strengthening, balance ]
breath: exhale
drishti: padhayoragrai
cues:
  - Keep the lower back heavy and rounded into the mat
  - Hover the legs and the shoulder blades just off the floor
  - Reach the arms long toward the feet
