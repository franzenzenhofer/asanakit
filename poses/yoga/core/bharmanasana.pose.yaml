asanakit: 2
id: bharmanasana
name: Tabletop
sanskrit: Bharmanāsana
english: Tabletop Pose
discipline: yoga
family: core
difficulty: 1
description: Neutral hands-and-knees. The wrists stack under the shoulders, the knees under the hips, and the spine holds a long neutral line from tail to crown - the flat table every cat-cow and bird-dog starts from.
tags: [ core, kneeling, neutral, beginner ]
breath: exhale
drishti: nasagrai
cues:
  - Wrists under shoulders, knees under hips
  - Hold the spine long and neutral, crown reaching forward
