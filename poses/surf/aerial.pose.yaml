asanakit: 2
id: aerial
name: Aerial
english: Aerial
discipline: surf
family: aerial
difficulty: 5
description: Airborne above the lip. The surfer leaves the wave with the board still glued to the feet, knees drawn up into the chest, trailing hand grabbing the rail to hold everything together, eyes already on the landing.
tags: [ surf, aerial, air, advanced, dynamic ]
cues:
  - Draw the knees up and stay compact - a small shape spins and lands
  - Grab the rail to keep the board with you, spot the landing
