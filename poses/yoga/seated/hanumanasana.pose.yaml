asanakit: 2
id: hanumanasana
name: Splits
sanskrit: Hanumānāsana
english: Monkey Pose (Front Splits)
discipline: yoga
family: seated
difficulty: 5
description: The full front splits, named for Hanuman's great leap. The left leg reaches straight forward and the right leg straight back, both resting along the floor, while the torso stays upright and the arms sweep overhead.
