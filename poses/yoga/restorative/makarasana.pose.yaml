asanakit: 2
id: makarasana
name: Crocodile Pose
sanskrit: Makarāsana
english: Crocodile Pose
discipline: yoga
family: restorative
difficulty: 1
description: A prone rest. The whole front body drapes along the floor, the legs stretch long and slightly apart, the chest lifts just enough to stack the forearms under the forehead.
tags: [ restorative, prone, breath-awareness ]
breath: free
drishti: nasagrai
cues:
  - Let the heels roll open and the legs go heavy
  - Stack the forearms and rest the forehead on them
  - Breathe into the back of the ribs
contact: [ hipCenter, kneeL, kneeR, ankleL, ankleR, elbowL, elbowR ]
camera: side
figure:
  grounded: true
  root:
    pitch: 90
  world:
    pelvis: { azimuth: 0, elevation: 0 }
    spine: { azimuth: 0, elevation: 16 }
    neck: { azimuth: 0, elevation: 10 }
    head: { azimuth: 0, elevation: 8 }
    upperArmL: { azimuth: 30, elevation: -16 }
    upperArmR: { azimuth: -30, elevation: -16 }
    forearmL: { azimuth: -55, elevation: 6 }
    forearmR: { azimuth: 55, elevation: 10 }
    handL: { azimuth: -55, elevation: 6 }
    handR: { azimuth: 55, elevation: 10 }
    thighL: { azimuth: 172, elevation: -2 }
    thighR: { azimuth: -172, elevation: -2 }
    shinL: { azimuth: 172, elevation: -2 }
    shinR: { azimuth: -172, elevation: -2 }
    footL: { azimuth: 172, elevation: 0 }
    footR: { azimuth: -172, elevation: 0 }
