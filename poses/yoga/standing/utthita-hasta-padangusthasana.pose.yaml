asanakit: 2
id: utthita-hasta-padangusthasana
name: Hand-to-Big-Toe Pose
sanskrit: Utthita Hasta Pādāṅguṣṭhāsana
english: Extended Hand-to-Big-Toe Pose
discipline: yoga
family: standing
difficulty: 4
description: A standing balance. The right leg extends straight forward at hip height, the right hand catching the big toe while the left hand rests on the waist and the spine stays tall.
tags: [ standing, balance, ashtanga, hamstring-stretch ]
breath: free
drishti: padhayoragrai
cues:
  - Stand tall, do not sink into the standing hip
  - Kick the lifted heel forward into the grip
  - Keep both shoulders level and relaxed
contact: [ toeL ]
camera: side
